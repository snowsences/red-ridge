<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17242d"><meta name="description" content="Red Ridge — your recipes, notes, cars and to-dos."><title>Red Ridge</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head>
<body>
<div id="gate" class="gate"><div class="gate-card"><p class="wordmark">Red Ridge<span>•</span></p><h1>A place for<br>your everyday.</h1><div class="gate-bands"><div>Recipes</div><div>Notes</div><div>Cars</div><div>To-Dos</div></div><p id="gateStatus">Your journal, with your Google account.</p><label class="check"><input id="trust" type="checkbox">Keep this private device available offline</label><p class="small">Saves a local copy on this device. Use only on a device you trust.</p><button id="signIn" class="primary">Sign in with Google</button><button id="tryDemo" class="ghost">Explore the demo</button><button id="gateSettings" class="text-button">Connection settings</button></div></div>
<div id="app" hidden>
<header class="desktop-header"><button class="wordmark" id="home">Red Ridge<span>•</span></button><nav id="nav" aria-label="Main navigation"></nav><button id="account" class="account" aria-label="Account and sync settings">K</button></header>
<div id="modeBar" class="mode-bar" hidden>Demo · sample entries, changes last only for this session <button id="exitDemo">Sign in</button></div>
<main><header class="page-head"><div><p id="eyebrow" class="eyebrow"></p><h1 id="pageTitle"></h1></div><button id="add" class="add-button" aria-label="Add entry">+</button></header><div id="tools" class="tools"></div><div id="workspace" class="workspace"><section id="list" aria-label="Entries"></section><aside id="detail" class="detail" aria-label="Entry details"></aside></div><div id="settings" hidden></div></main><footer class="sync-footer"><span id="syncStatus" role="status">Connecting…</span><button id="lock" class="text-button" hidden>Lock notes</button></footer>
</div>
<dialog id="editor" class="editor"></dialog><dialog id="confirm" class="confirm"></dialog><div id="toast" class="toast" role="status"></div>
<script type="module" src="./app.js"></script></body></html>
