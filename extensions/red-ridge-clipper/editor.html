<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clip to Red Ridge</title><link rel="stylesheet" href="editor.css"></head><body>
<header><img src="icon-48.png" alt="" width="32" height="32"><div><h1>Clip to Red Ridge</h1><p>A new note, ready for your additions.</p></div></header>
<form id="form"><label>Title<input id="title" maxlength="300" required></label><label>Category<input id="category" list="categories" maxlength="100" placeholder="General"><datalist id="categories"><option value="General"></option></datalist><span class="hint">Choose an existing category or type a new one.</span></label><label>Note<textarea id="text" required maxlength="20000" placeholder="Paste or write your note…"></textarea></label><div class="source"><label class="check"><input type="checkbox" id="includeSource">Include source link</label><a id="source" target="_blank" rel="noopener noreferrer"></a></div><div id="status" role="status" aria-live="polite"></div><footer><button id="open" type="button" class="secondary">Open Red Ridge</button><button id="send" type="submit">Send to Red Ridge</button></footer></form><script src="editor.js"></script></body></html>
